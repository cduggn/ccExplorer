name: goreleaser

on:
  push:
    tags:
      - "v*"
    branches:
      - main  # Only allow releases from main branch

permissions:
  contents: write
  packages: write  # Required for GHCR

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          # Get the branch containing this tag
          BRANCHES=$(git branch -r --contains ${{ github.ref }})
          echo "Branches containing this tag: $BRANCHES"

          # Check if main branch contains this tag
          if ! echo "$BRANCHES" | grep -q "origin/main"; then
            echo "Error: Tag ${{ github.ref }} is not on main branch"
            echo "Please create releases only from the main branch"
            exit 1
          fi
          echo "✓ Tag is on main branch, proceeding with release"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISHER }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}